name: Build and typecheck

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Audit npm dependencies
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e "const r=require('/tmp/npm-audit.json'); console.log('npm audit summary:', JSON.stringify(r.metadata?.vulnerabilities || {})); for (const [name,v] of Object.entries(r.vulnerabilities || {})) console.log(JSON.stringify({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,via:v.via}));"
          npm ls firebase @firebase/firestore @grpc/grpc-js --depth=2
          npm audit --audit-level=moderate
      - name: Smoke-test Render server
        run: |
          PORT=10000 npm start > /tmp/nofap-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 25); do
            if curl --fail --silent http://127.0.0.1:10000/healthz > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:10000/healthz
          curl --fail --silent http://127.0.0.1:10000/ > /dev/null
          curl --fail --silent http://127.0.0.1:10000/tracker > /dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:10000/assets/missing-file.js)" = "404"

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: functions
      - run: npm run build
        working-directory: functions
      - name: Audit Functions dependencies
        working-directory: functions
        run: |
          npm audit --json > /tmp/functions-audit.json || true
          node -e "const r=require('/tmp/functions-audit.json'); console.log('Functions npm audit summary:', JSON.stringify(r.metadata?.vulnerabilities || {})); for (const [name,v] of Object.entries(r.vulnerabilities || {})) console.log(JSON.stringify({name,severity:v.severity,fixAvailable:v.fixAvailable,via:v.via}));"
          npm ls @grpc/grpc-js glob minimatch rimraf gaxios gcp-metadata google-gax --depth=5
          npm audit --audit-level=moderate
